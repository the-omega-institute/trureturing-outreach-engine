name: Coordinator

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [tick, status, doctor, reviews, mathesis-test, notes]
        default: status
      note_id:
        description: 'For action=notes: existing staged note ID'
        type: string
      note_revision:
        description: 'For note_action=publish: exact staged revision'
        type: string
      recover_record:
        description: 'Existing Zenodo draft ID after account/receipt inspection'
        type: string
      reuse_draft_from:
        description: 'Earlier unpublished artifact revision, only for explicit reuse'
        type: string
      note_action:
        description: 'For action=notes: inspect the receipt or recover publication'
        type: choice
        options: [status, publish]
        default: status
      refresh_credentials:
        type: boolean
        default: false

concurrency:
  group: outreach-control-single-writer
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUTREACH_DATA_ROOT: ${{ github.workspace }}/data
  OUTREACH_DATA_REPO: ${{ secrets.OUTREACH_DATA_REPO }}
  OUTREACH_DATA_BRANCH: ${{ vars.OUTREACH_DATA_BRANCH }}
  OUTREACH_ENGINE_REPO: ${{ github.repository }}
  OUTREACH_PUBLIC_LOG: '1'
  GH_TOKEN: ${{ secrets.OUTREACH_DATA_TOKEN }}

jobs:
  coordinator:
    environment: outreach-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Locate runtime credentials
        run: echo "OUTREACH_CREDENTIAL_FILE=$RUNNER_TEMP/outreach-runtime.env" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare data
        run: python3 -m managed.hosted checkout
      - name: Prepare credentials
        env:
          OUTREACH_NYX_SESSION: ${{ secrets.OUTREACH_NYX_SESSION }}
          OUTREACH_GRAPH_CACHE: ${{ secrets.OUTREACH_GRAPH_CACHE }}
          FORCE_REFRESH: ${{ inputs.refresh_credentials || 'false' }}
        run: python3 -m managed.hosted credentials
      - name: Run coordinator
        env:
          OUTREACH_REVIEW_KEY: ${{ secrets.OUTREACH_REVIEW_KEY }}
          CONTROL_ACTION: ${{ inputs.action == 'notes' && 'status' || inputs.action || 'tick' }}
        run: python3 -m managed.hosted control
      - name: Reconcile receipts
        if: ${{ (inputs.action || 'tick') == 'tick' }}
        continue-on-error: true
        run: python3 -m managed.hosted submissions
      - name: Synchronize feed
        if: ${{ (inputs.action || 'tick') == 'tick' }}
        continue-on-error: true
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: python3 -m managed.hosted pages

  # Delivery runs inside the same run after the tick. As a separate workflow
  # in the shared single-writer group it stayed pending and was cancelled by
  # the next scheduled tick, so queued publications never moved.
  delivery:
    needs: coordinator
    if: ${{ (inputs.action || 'tick') == 'tick' || inputs.action == 'notes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare data
        run: python3 -m managed.hosted checkout
      - name: Process delivery queue
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          OUTREACH_NOTE_REQUEST: ${{ secrets.OUTREACH_NOTE_REQUEST }}
          NOTE_ACTION: drain
          NOTE_USE_INPUTS: ${{ inputs.action == 'notes' && 'true' || 'false' }}
          INPUT_NOTE_ACTION: ${{ inputs.note_action }}
          INPUT_NOTE_ID: ${{ inputs.note_id }}
          INPUT_NOTE_REVISION: ${{ inputs.note_revision }}
          INPUT_NOTE_RECOVER_RECORD: ${{ inputs.recover_record }}
          INPUT_NOTE_REUSE_DRAFT_FROM: ${{ inputs.reuse_draft_from }}
        run: python3 -m managed.hosted notes
