name: Coverage

on:
  workflow_run:
    workflows: [Coordinator]
    types: [completed]
  workflow_dispatch:

concurrency:
  # A cancelled/manual diagnostic Coordinator must not acquire the writer lock
  # and replace a pending tick before this workflow's job can be skipped.
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')) && 'outreach-control-single-writer' || format('outreach-coverage-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUTREACH_DATA_ROOT: ${{ github.workspace }}/data
  OUTREACH_DATA_REPO: ${{ secrets.OUTREACH_DATA_REPO }}
  OUTREACH_DATA_BRANCH: ${{ vars.OUTREACH_DATA_BRANCH }}
  OUTREACH_ENGINE_REPO: ${{ github.repository }}
  OUTREACH_PUBLIC_LOG: '1'
  GH_TOKEN: ${{ secrets.OUTREACH_DATA_TOKEN }}

jobs:
  coverage:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare data
        run: python3 -m managed.hosted checkout
      - name: Refresh coverage
        run: python3 -m managed.hosted coverage
