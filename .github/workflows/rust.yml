name: Rust parity

on:
  pull_request:
    paths: ['scenarios/**', 'rust/**', 'managed/**', 'scripts/short_notes/**', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['scenarios/**', 'rust/**', 'managed/**', 'scripts/short_notes/**', '.github/workflows/rust.yml']

permissions:
  contents: read

concurrency:
  group: rust-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import subprocess, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              toolchain = tomllib.load(source)['toolchain']
          command = ['rustup', 'toolchain', 'install', toolchain['channel'],
                     '--profile', toolchain['profile']]
          for component in toolchain['components']:
              command += ['--component', component]
          subprocess.run(command, check=True)
          PY
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workspace boundaries
        run: python3 check_architecture.py
      - name: Check vectors against Python
        run: python3 -m unittest discover -s vectors
      - name: Check current Python workflow hashes
        run: python3 check_live_workflows.py
      - name: Check current Python SQL projections
        run: python3 check_live_sql.py
      - name: Read-only command byte parity
        run: python3 parity/compare.py
      - name: Request and packet validator parity
        run: python3 parity/validators.py
      - name: Signing and ingestion replay parity
        run: python3 parity/signing_ingest.py
      - name: Offline stage builder parity
        run: python3 parity/builders.py
      - name: Python scenarios and recording boundaries
        working-directory: .
        run: |
          python3 scenarios/runner.py
          python3 -m unittest discover -s managed/tests -p 'test_recording*.py'
      - name: Rust Mathesis, publication, sent-event, CMA pool and mail delivery scenarios
        run: |
          python3 scenarios.py
          python3 -m unittest discover -s ../scenarios -p 'test_*.py'
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies
        run: cargo deny --locked check
