name: Delivery checks

on:
  pull_request:
    paths: ['scripts/short_notes/**', '.github/workflows/short-notes*.yml']
  push:
    branches: [main]
    paths: ['scripts/short_notes/**', '.github/workflows/short-notes*.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OUTREACH_PUBLIC_LOG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m managed.hosted delivery-tests
