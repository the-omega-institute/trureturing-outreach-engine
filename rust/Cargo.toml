[workspace]
members = ["crates/outreach-canon", "crates/outreach-model", "crates/outreach-core", "crates/outreach-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
outreach-canon = { version = "=0.1.0", path = "crates/outreach-canon" }
outreach-model = { version = "=0.1.0", path = "crates/outreach-model" }
outreach-core = { version = "=0.1.0", path = "crates/outreach-core" }
hmac = "=0.12.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
ryu = "=1.0.23"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

